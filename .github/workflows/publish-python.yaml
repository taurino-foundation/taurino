# IMPORTANT: PyPI is NEVER triggered by push, tag or release.
# One explicit 'Run workflow' click + version selection is mandatory.
name: Publish Python
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published GitHub release, e.g. v0.1.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-pypi-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release before build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tag exists as a published release
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid tag: expected vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,tagName > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json'))
          if r['isDraft'] or r['isPrerelease']:
              raise SystemExit('Draft/prerelease publishing is disabled.')
          PY
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
  wheels:
    name: Wheel / ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release metadata
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python .github/scripts/check_metadata.py
          python .github/scripts/verify_tag.py "$TAG"
      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          maturin-version: v1.14.1
          manylinux: '2_28'
          args: --release --out dist --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish to PyPI (manual approval optional)
    needs: [validate, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/taurino/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Inspect distribution files
        run: |
          ls -lah dist
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('dist').iterdir())
          assert files and any(f.suffix == '.whl' for f in files)
          assert sum(f.name.endswith('.tar.gz') for f in files)==1
          assert all(f.name.startswith('taurino-') for f in files)
          print(f'Validated {len(files)} distributions')
          PY
      - uses: astral-sh/setup-uv@v7
      - name: Publish via PyPI Trusted Publishing (OIDC)
        run: uv publish --trusted-publishing always dist/*
