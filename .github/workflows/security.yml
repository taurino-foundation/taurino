name: Dependency Security
on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'pyproject.toml', 'uv.lock', '.github/workflows/security.yml']
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**/Cargo.toml', 'pyproject.toml', 'uv.lock', '.github/workflows/security.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Audit locked Python dependencies
        shell: bash
        run: |
          if [[ ! -f uv.lock ]]; then
            echo 'uv.lock missing: Python lock audit skipped; Rust audit still runs.'
            exit 0
          fi
          uvx pip-audit --version
          uv export --locked --no-dev --format requirements-txt --output-file /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt
