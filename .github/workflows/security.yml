# SPDX-License-Identifier: MIT OR Apache-2.0

name: Dependency Security

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"

  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"

  schedule:
    - cron: "17 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: Rust / Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Verify Cargo.lock
        shell: bash
        run: |
          test -f Cargo.lock || {
            echo "::error::Cargo.lock is missing"
            exit 1
          }

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

  python-audit:
    name: Python / Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify uv.lock
        shell: bash
        run: |
          test -f uv.lock || {
            echo "::error::uv.lock is missing"
            exit 1
          }

      - name: Export locked dependencies
        shell: bash
        run: |
          uv export \
            --locked \
            --no-dev \
            --no-default-groups \
            --no-emit-project \
            --format requirements-txt \
            --output-file /tmp/requirements-audit.txt

      - name: Audit Python dependencies
        shell: bash
        run: |
          uvx --from pip-audit==2.10.1 pip-audit \
            --disable-pip \
            -r /tmp/requirements-audit.txt
