name: Pull Request Title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce Conventional Commit PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os,re
          title=os.environ['TITLE']
          pattern=r'^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([\w./-]+\))?(!)?: .+'
          if not re.match(pattern,title) and not title.startswith('chore(main): release '):
              raise SystemExit('Use a Conventional Commit title: feat(ipc): add shared memory transport')
          PY
