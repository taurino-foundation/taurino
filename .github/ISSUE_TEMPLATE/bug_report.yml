name: Bug report
description: Report a reproducible Taurino defect
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the issue and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code and steps to reproduce.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Environment
      placeholder: 'Windows 11, Python 3.13, Taurino 0.1.0'
    validations:
      required: true
