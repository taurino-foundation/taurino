[package]
name = "taurino"
version = "0.1.0"
edition = "2021"

[lib]
name = "_taurino"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pyo3 = { version = "=0.29", features = ["anyhow", "bytes","auto-initialize", "extension-module", "generate-import-lib"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
