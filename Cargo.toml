[package]
name = "taurino"
version = "0.1.0"
edition = "2021"

[lib]
name = "_taurino"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
tao = "0.36.0"
wry = "0.56.1"
pyo3 = { version = "=0.29", features = ["anyhow", "bytes","auto-initialize", "extension-module", "generate-import-lib"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
httparse = "1.10.1"
http = "1.4.0"
bytes = "1.11.1"
pin-project-lite = "0.2.16"
rand = "0.10.0"
url = { version = "2.5.7", features = ["serde"] }